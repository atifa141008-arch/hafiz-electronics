name: Build Hafiz Electronics APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build React/Vite app
        run: npm run build

      - name: Check Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project found successfully."

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Hafiz-Electronics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
